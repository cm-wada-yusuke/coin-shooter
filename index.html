<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>coin-shooter 動作確認</title>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --accent: #facc15;
        --card: #1e293b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        width: 100%;
        max-width: 480px;
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
      }
      button {
        width: 100%;
        padding: 16px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #000;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      .count {
        font-size: 3rem;
        text-align: center;
        margin: 16px 0;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        margin: 16px 0 0;
        font-size: 0.9rem;
      }
      dt {
        opacity: 0.7;
      }
      dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>INSERT COIN</h1>
      <p>raw.githack.com の動作確認ページです。ボタンを押すと数が増えれば JavaScript が動いています。</p>
      <div class="count" id="count">0</div>
      <button id="coin" type="button">コインを入れる</button>
      <dl>
        <dt>画面の幅</dt>
        <dd id="width">-</dd>
        <dt>タッチ対応</dt>
        <dd id="touch">-</dd>
        <dt>表示時刻</dt>
        <dd id="time">-</dd>
      </dl>
    </main>
    <script>
      const countEl = document.getElementById("count");
      const widthEl = document.getElementById("width");
      const touchEl = document.getElementById("touch");
      const timeEl = document.getElementById("time");
      let count = 0;

      document.getElementById("coin").addEventListener("click", () => {
        count += 1;
        countEl.textContent = String(count);
      });

      const render = () => {
        widthEl.textContent = `${window.innerWidth}px`;
        touchEl.textContent = navigator.maxTouchPoints > 0 ? "あり" : "なし";
        timeEl.textContent = new Date().toLocaleString("ja-JP");
      };
      window.addEventListener("resize", render);
      render();
    </script>
  </body>
</html>
