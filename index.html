<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>coin-shooter</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #121a2b;
      --border: #1f2a44;
      --text: #e6ebf5;
      --muted: #8b96b3;
      --accent: #f5c542;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      min-height: 100dvh;
      padding: 32px 16px;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; letter-spacing: .02em; }
    h1 span { color: var(--accent); }
    p.lead { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }

    /* ゲーム一覧 */
    ul.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    ul.games a {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    ul.games a:hover, ul.games a:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
    ul.games .name { font-weight: 600; font-size: 1.05rem; }
    ul.games .file { color: var(--muted); font-size: .8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    ul.games .arrow { color: var(--accent); font-size: 1.1rem; }

    footer { margin-top: 32px; color: var(--muted); font-size: .8rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>coin<span>-</span>shooter</h1>
    <p class="lead">各ページへのリンク一覧です。</p>

    <!--
      新しい HTML を追加したら、下のリストに <li> を 1 行追加してください。
      <li><a href="xxx.html"><span class="name">表示名</span><span class="file">xxx.html</span><span class="arrow">→</span></a></li>
    -->
    <ul class="games">
      <li><a href="waddy.html"><span class="name">made by waddy</span><span class="file">waddy.html</span><span class="arrow">→</span></a></li>
    </ul>

    <footer>coin-shooter</footer>
  </main>
</body>
</html>
